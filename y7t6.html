<script>
const LESSON_ID = `y7t6`;
const SLIDES = [
  { type:`intro`, title:`Digital Literacy, E-Safety & the Law`, body:`
<p>Being a responsible digital citizen means understanding how to stay safe online, how to behave ethically, and what the law says about using technology.</p>
<div class="callout">🎯 In this lesson: online safety, personal information, cyberbullying, copyright, the Computer Misuse Act, and the Data Protection Act.</div>
<div class="three-col">
  <div class="card"><h4>E-Safety</h4><p>Staying safe from dangers online — protecting personal data, avoiding scams, and managing your digital footprint.</p></div>
  <div class="card"><h4>Ethics</h4><p>Behaving responsibly and respectfully online — treating others well, giving credit for others' work.</p></div>
  <div class="card"><h4>The Law</h4><p>Acts of Parliament that govern how computers, data, and online content must be treated.</p></div>
</div>` },

  { type:`concept`, title:`Personal Information & Privacy`, body:`
<p>Your <strong>personal information</strong> is data that can identify you. Sharing it online carries real risks.</p>
<div class="two-col">
  <div class="card"><h4>What counts as personal info?</h4><ul>
    <li>Full name and date of birth</li>
    <li>Home address and phone number</li>
    <li>School name and email address</li>
    <li>Photos of you or your location</li>
    <li>Passwords and account details</li>
  </ul></div>
  <div class="card"><h4>Why protect it?</h4><ul>
    <li>Strangers can use it to locate or contact you</li>
    <li>Can be used in identity theft or scams</li>
    <li>Once shared online, very hard to remove</li>
    <li>Your <strong>digital footprint</strong> lasts forever</li>
  </ul></div>
</div>
<div class="callout warn">⚠️ Your <strong>digital footprint</strong> is the trail of data you leave online — posts, searches, purchases. Future employers and universities can see it!</div>` },

  { type:`concept`, title:`Cyberbullying & Online Behaviour`, body:`
<p><strong>Cyberbullying</strong> is using technology to bully, harass or intimidate someone. It is a serious issue and can have lasting harm.</p>
<div class="two-col">
  <div class="card"><h4>Forms of cyberbullying</h4><ul>
    <li>Sending threatening or nasty messages</li>
    <li>Posting embarrassing photos without consent</li>
    <li>Excluding someone deliberately online</li>
    <li>Creating fake profiles to impersonate someone</li>
    <li>Spreading rumours on social media</li>
  </ul></div>
  <div class="card"><h4>What to do</h4><ul>
    <li><strong>Don't reply</strong> — it often makes things worse</li>
    <li><strong>Save evidence</strong> — screenshot messages</li>
    <li><strong>Block</strong> the person</li>
    <li><strong>Tell</strong> a trusted adult or teacher</li>
    <li><strong>Report</strong> to the platform</li>
  </ul></div>
</div>
<div class="callout danger">🚨 Cyberbullying can be a criminal offence under the Malicious Communications Act and the Communications Act 2003.</div>` },

  { type:`concept`, title:`Copyright & Intellectual Property`, body:`
<p><strong>Copyright</strong> is a law that protects creators — authors, artists, musicians and developers — giving them control over how their work is used.</p>
<div class="two-col">
  <div class="card"><h4>What does copyright protect?</h4><ul>
    <li>Written work — books, articles, lyrics</li>
    <li>Music and recordings</li>
    <li>Images, photographs and artwork</li>
    <li>Software and code</li>
    <li>Films and videos</li>
  </ul></div>
  <div class="card"><h4>What you cannot do without permission</h4><ul>
    <li>Copy and redistribute someone's work</li>
    <li>Download music or films illegally (piracy)</li>
    <li>Use images from the internet in your own work</li>
    <li>Pretend someone else's work is yours (plagiarism)</li>
  </ul></div>
</div>
<div class="callout">💡 <strong>Creative Commons</strong> licences let creators share work with conditions — some allow free use as long as you credit the author.</div>` },

  { type:`concept`, title:`The Computer Misuse Act 1990`, body:`
<p>The <strong>Computer Misuse Act 1990</strong> makes it illegal to access or modify computer systems without permission. It has three main offences:</p>
<table class="bit-table">
  <tr><th>Offence</th><th>Example</th><th>Max Sentence</th></tr>
  <tr><td><strong>Unauthorised access</strong></td><td>Guessing someone's password to log into their account</td><td>2 years</td></tr>
  <tr><td><strong>Unauthorised access to commit a further crime</strong></td><td>Hacking a bank account to steal money</td><td>5 years</td></tr>
  <tr><td><strong>Unauthorised modification</strong></td><td>Installing malware, deleting or changing files</td><td>10 years</td></tr>
</table>
<div class="callout warn">⚠️ Even accessing your friend's account without permission — even if they gave you the password — could be illegal under this Act.</div>` },

  { type:`concept`, title:`The Data Protection Act 2018 & GDPR`, body:`
<p>The <strong>Data Protection Act 2018</strong> (incorporating GDPR) controls how organisations collect, store and use personal data.</p>
<div class="two-col">
  <div class="card"><h4>Key principles</h4><ul>
    <li>Data must be collected <strong>lawfully and fairly</strong></li>
    <li>Only collect what is <strong>necessary</strong></li>
    <li>Data must be <strong>accurate</strong> and kept up to date</li>
    <li>Not kept longer than <strong>necessary</strong></li>
    <li>Stored <strong>securely</strong></li>
    <li>Not transferred outside the UK without protection</li>
  </ul></div>
  <div class="card"><h4>Your rights</h4><ul>
    <li>Right to <strong>access</strong> your data</li>
    <li>Right to have data <strong>corrected</strong></li>
    <li>Right to have data <strong>deleted</strong> (right to be forgotten)</li>
    <li>Right to <strong>object</strong> to data being used</li>
    <li>Right to <strong>data portability</strong></li>
  </ul></div>
</div>
<div class="callout">💡 <strong>GDPR</strong> = General Data Protection Regulation. It applies across the UK and EU and carries fines of up to €20 million or 4% of global turnover for breaches.</div>` },

  { type:`activity`, title:`Guided Tasks — Digital Literacy & the Law`, body:`

  <span class="fb" id="fdl8"></span>
</div>

  { type:`summary`, title:`Topic Summary`, body:`
<ul>
  <li>Your <strong>digital footprint</strong> is permanent — think before you post</li>
  <li><strong>Personal information</strong> includes your name, address, school, photos and passwords — keep them private</li>

function attachCheckListeners() {
  document.querySelectorAll('.check-btn[data-inp]').forEach(function(btn) {
    btn._checkHandler && btn.removeEventListener('click', btn._checkHandler);
    btn._checkHandler = function() {
      var inputId = this.getAttribute('data-inp');
      var fbId    = this.getAttribute('data-fb');
      var answers = this.getAttribute('data-ans').split('|');
      schkAny(inputId, fbId, answers);
    };
    btn.addEventListener('click', btn._checkHandler);
  });
}

function render() {
  const s = SLIDES[cur], total = SLIDES.length;
  const typeLabel = s.type === 'compete' ? 'Competition' : s.type.charAt(0).toUpperCase() + s.type.slice(1);
  document.getElementById('slide').innerHTML =
    '<div class="eyebrow">' +
    '<span class="stype t-' + s.type + '">' + typeLabel + '</span>' +
    '<span class="snum">Slide ' + (cur+1) + ' of ' + total + '</span>' +
    '</div>' +
    '<h1>' + s.title + '</h1>' +
    '<div class="sb">' + (s.body || '') + '</div>';
  document.getElementById('prog').style.width = ((cur+1)/total*100) + '%';
  document.getElementById('sctr').textContent  = (cur+1) + ' / ' + total;
  document.getElementById('prev-btn').disabled  = cur === 0;
  document.getElementById('next-btn').disabled  = cur === total - 1;
  const dots = document.getElementById('dots');
  dots.innerHTML = '';
  SLIDES.forEach((sl, i) => {
    const d = document.createElement('div');
    d.className = 'pdot' + (sl.type==='compete' ? ' compete-dot' : '') + (i===cur ? ' active' : i<cur ? ' done' : '');
    d.onclick = () => { cur=i; render(); };
    d.title = sl.title;
    dots.appendChild(d);
  });
  if (s.type === 'compete') {
    const lb = JSON.parse(localStorage.getItem('ks3_lb_' + LESSON_ID) || '[]');
    const el = document.getElementById('leaderboard');
    if (el) renderLeaderboard(el, lb);
  }
  attachCheckListeners();
}

function goNext() { if(cur<SLIDES.length-1){cur++;render();} }
function goPrev() { if(cur>0){cur--;render();} }
document.addEventListener('keydown', e => {
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();goNext();}
  if(e.key==='ArrowLeft'){e.preventDefault();goPrev();}
});

function schkAny(inputId, fbId, answers) {
  const clean = s => String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
  const val = clean(document.getElementById(inputId).value.trim());
  const ok  = answers.map(a => clean(a)).includes(val);
  const fb  = document.getElementById(fbId);
  fb.className   = 'fb ' + (ok ? 'ok' : 'no');
  fb.textContent = ok ? '✓ Correct!' : '✗ Try again — answer: ' + answers[0];
}

// ── SPEED CHALLENGE ──────────────────────────────────────────
let compQs = [], compIdx = 0, compScore = 0, compName = '', compTimer = null, compRunning = false;

function startComp() {
  compName = document.getElementById('comp-name').value.trim() || 'Anonymous';
  compScore = 0; compIdx = 0; compRunning = true;
  compQs = [...COMP_Qs].sort(() => Math.random()-0.5);
  document.getElementById('comp-start-area').style.display = 'none';
  document.getElementById('comp-game-area').style.display  = 'block';
  nextCompQ();
}

function nextCompQ() {
  if (compIdx >= compQs.length) { endComp(); return; }
  const q = compQs[compIdx];
  document.getElementById('comp-q').textContent       = q.q;
  document.getElementById('comp-qnum').textContent    = 'Q' + (compIdx+1) + ' / ' + compQs.length;
  document.getElementById('comp-ans').value           = '';
  document.getElementById('comp-feedback').textContent = '';
  document.getElementById('comp-ans').focus();
  let t = 15;
  const fill = document.getElementById('comp-timer-fill');
  fill.style.transition = 'none';
  fill.style.width = '100%';
  setTimeout(() => { fill.style.transition='width 1s linear'; fill.style.width='0%'; }, 50);
  clearInterval(compTimer);
  compTimer = setInterval(() => {
    t--;
    document.getElementById('comp-timeleft').textContent = t + 's';
    if (t <= 0) { clearInterval(compTimer); autoNextComp(); }
  }, 1000);
}

function autoNextComp() {
  if (!compRunning) return;
  const fb = document.getElementById('comp-feedback');
  fb.textContent = '⏱ Time! Ans: ' + compQs[compIdx].answers[0];
  fb.style.color = 'var(--danger)';
  compIdx++;
  setTimeout(nextCompQ, 1300);
}

function submitCompAns() {
  if (!compRunning) return;
  clearInterval(compTimer);
  const clean = s => String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
  const ans = clean(document.getElementById('comp-ans').value.trim());
  const q   = compQs[compIdx];
  const ok  = q.answers.map(a => clean(a)).includes(ans);
  const pct = parseFloat(document.getElementById('comp-timer-fill').style.width) || 0;
  const pts = ok ? Math.ceil(pct/10) + 10 : 0;
  const fb  = document.getElementById('comp-feedback');
  if (ok) {
    compScore += pts;
    document.getElementById('comp-score').textContent = compScore;
    fb.textContent = '✓ +' + pts + ' pts!';
    fb.style.color = 'var(--success)';
  } else {
    fb.textContent = '✗ Ans: ' + q.answers[0];
    fb.style.color = 'var(--danger)';
  }
  compIdx++;
  setTimeout(nextCompQ, 1000);
}

document.addEventListener('keydown', e => {
  const el = document.getElementById('comp-ans');
  if (e.key==='Enter' && compRunning && el && document.activeElement===el) submitCompAns();
});

function endComp() {
  compRunning = false;
  document.getElementById('comp-game-area').style.display = 'none';
  document.getElementById('comp-end-area').style.display  = 'block';
  document.getElementById('comp-final-name').textContent  = compName;
  document.getElementById('comp-final-score').textContent = compScore;
  const lb = JSON.parse(localStorage.getItem('ks3_lb_' + LESSON_ID) || '[]');
  lb.push({ name: compName, score: compScore, ts: Date.now() });
  lb.sort((a,b) => b.score - a.score);
  localStorage.setItem('ks3_lb_' + LESSON_ID, JSON.stringify(lb.slice(0,10)));
  const el = document.getElementById('comp-lb-end');
  if (el) renderLeaderboard(el, lb);
}

function resetComp() {
  document.getElementById('comp-end-area').style.display   = 'none';
  document.getElementById('comp-start-area').style.display = 'block';
  const lb = JSON.parse(localStorage.getItem('ks3_lb_' + LESSON_ID) || '[]');
  const el = document.getElementById('leaderboard');
  if (el) renderLeaderboard(el, lb);
}

function renderLeaderboard(el, lb) {
  el.innerHTML = lb.slice(0,10).map((e,i) =>
    '<li><span class="lb-pos">' + (i+1) + '</span>' +
    '<span class="lb-name">' + e.name + '</span>' +
    '<span class="lb-score">' + e.score + ' pts</span></li>'
  ).join('');
}

render();
</script>
