<script>
const LESSON_ID = `y8t6`;
const SLIDES = [
  { type:`intro`, title:`Data Representation: Images, Sound & Compression`, body:`
<p>Computers store <strong>everything</strong> as binary — including images, audio and video. Understanding how this works helps you understand file sizes, quality and compression.</p>
<div class="callout">🎯 This lesson: how images are stored as pixels, colour depth and resolution, how sound is sampled, and how compression reduces file sizes.</div>
<div class="three-col">
  <div class="card"><h4>Images</h4><p>Stored as a grid of pixels. Each pixel has a colour value stored as binary.</p></div>
  <div class="card"><h4>Sound</h4><p>Stored by sampling the sound wave at regular intervals and converting to binary.</p></div>
  <div class="card"><h4>Compression</h4><p>Reduces file size — either by removing data (lossy) or encoding data more efficiently (lossless).</p></div>
</div>` },

  { type:`concept`, title:`How Images Are Stored — Pixels & Colour Depth`, body:`
<p>A digital image is a grid of <strong>pixels</strong> (picture elements). Each pixel stores a colour value as binary.</p>
<div class="two-col">
  <div class="card"><h4>Colour depth</h4><p>The number of <strong>bits per pixel</strong>. More bits = more possible colours:</p><ul>
    <li><strong>1-bit</strong> = 2 colours (black/white)</li>
    <li><strong>8-bit</strong> = 256 colours</li>
    <li><strong>24-bit</strong> = 16.7 million colours (true colour)</li>
  </ul></div>
  <div class="card"><h4>Resolution</h4><p>The number of pixels in the image (width × height). Higher resolution = more detail = larger file size.</p><ul>
    <li>A 4×4 pixel image = 16 pixels</li>
    <li>A 1920×1080 image = ~2 million pixels</li>
  </ul></div>
</div>
<div class="callout">📐 <strong>File size formula:</strong> Width (px) × Height (px) × Colour depth (bits) ÷ 8 = bytes</div>` },

  { type:`concept`, title:`Calculating Image File Size`, body:`
<p>You can calculate an uncompressed image's file size using the formula:</p>
<pre>File size (bits) = Width × Height × Colour depth
File size (bytes) = File size (bits) ÷ 8</pre>
<p><strong>Example:</strong> A 100×100 pixel image with 24-bit colour depth:</p>
<pre>100 × 100 × 24 = 240,000 bits
240,000 ÷ 8 = 30,000 bytes = ~29.3 KB</pre>
<div class="two-col">
  <div class="card"><h4>What increases file size?</h4><ul>
    <li>Higher resolution (more pixels)</li>
    <li>Greater colour depth (more bits per pixel)</li>
  </ul></div>
  <div class="card"><h4>Try this</h4><p>A 200×150 image, 8-bit colour:<br><code>200 × 150 × 8 = 240,000 bits</code><br><code>240,000 ÷ 8 = 30,000 bytes</code></p></div>
</div>
<div class="callout warn">⚠️ This formula gives <strong>uncompressed</strong> file size. Real files use compression to reduce this significantly.</div>` },

  { type:`concept`, title:`How Sound Is Stored — Sampling`, body:`
<p>Sound is an analogue wave. To store it digitally, we <strong>sample</strong> the wave — measure its amplitude at regular intervals and convert each measurement to binary.</p>
<div class="two-col">
  <div class="card"><h4>Sample rate</h4><p>How many samples are taken <strong>per second</strong> (Hz).<br>Higher sample rate = better quality, larger file.</p><ul>
    <li>CD quality = 44,100 Hz (44.1 kHz)</li>
    <li>Phone call ≈ 8,000 Hz</li>
  </ul></div>
  <div class="card"><h4>Bit depth (sample resolution)</h4><p>The number of <strong>bits per sample</strong>. More bits = more accurate amplitude values = better quality.</p><ul>
    <li>CD quality = 16-bit</li>
    <li>Studio audio = 24-bit</li>
  </ul></div>
</div>
<div class="callout">🎵 <strong>Sound file size (bits)</strong> = Sample rate × Bit depth × Duration (seconds) × Channels</div>` },

  { type:`concept`, title:`Compression — Lossy vs Lossless`, body:`
<p>Compression reduces file size. There are two types:</p>
<div class="two-col">
  <div class="card"><h4>Lossy compression</h4><p>Permanently <strong>removes</strong> some data — usually data humans can barely notice. The original cannot be restored.</p><ul>
    <li>Used for: JPEG images, MP3 audio, MP4 video</li>
    <li>Smaller files, but some quality loss</li>
    <li>Good for streaming and web images</li>
  </ul></div>
  <div class="card"><h4>Lossless compression</h4><p>Encodes data more efficiently — <strong>no data is lost</strong>. The original file can be perfectly restored.</p><ul>
    <li>Used for: PNG images, FLAC audio, ZIP files</li>
    <li>Larger than lossy, but no quality loss</li>
    <li>Good for documents, software, medical images</li>
  </ul></div>
</div>
<div class="callout warn">⚠️ Each time you save a JPEG (lossy), quality is lost a little more. Always keep a lossless original!</div>` },

  { type:`concept`, title:`Run-Length Encoding (RLE)`, body:`
<p><strong>Run-Length Encoding</strong> is a simple lossless compression technique. Instead of storing repeated values individually, it stores the value and how many times it repeats.</p>
<div class="callout">📦 Example — a row of pixels:<br>
<code>WWWWWBBBWWW</code> → stored as <code>5W 3B 3W</code><br>
Original: 11 values stored. Compressed: 6 values stored. Much smaller!</div>
<div class="two-col">
  <div class="card"><h4>When RLE works well</h4><ul>
    <li>Images with large areas of the same colour</li>
    <li>Simple diagrams, logos, icons</li>
    <li>Fax transmissions</li>
  </ul></div>
  <div class="card"><h4>When RLE works poorly</h4><ul>
    <li>Photographs with many different colours</li>
    <li>High-detail images</li>
    <li>Can even make files <em>larger</em> if every pixel is different</li>
  </ul></div>
</div>` },

  { type:`summary`, title:`Topic Summary`, body:`
<ul>
  <li>Images are stored as a grid of <strong>pixels</strong> — each pixel's colour is stored in binary</li>
  <li><strong>Colour depth</strong> = bits per pixel. 24-bit = 16.7 million colours (true colour)</li>
  <li><strong>File size</strong> = Width × Height × Colour depth (bits) ÷ 8 = bytes</li>
  <li>Sound is stored by <strong>sampling</strong> — measuring amplitude at regular intervals</li>
  <li>Higher <strong>sample rate</strong> and greater <strong>bit depth</strong> = better quality but larger file</li>
  <li><strong>Lossy compression</strong> (JPEG, MP3) — removes data permanently, smaller files</li>
  <li><strong>Lossless compression</strong> (PNG, FLAC) — no data lost, original can be restored</li>
  <li><strong>RLE</strong> is a simple lossless technique that stores repeated values as count + value</li>
</ul>
<div class="callout success">✅ Excellent work completing Year 8 Computer Science! You now understand how all digital media is stored and compressed.</div>` },

    btn._checkHandler && btn.removeEventListener('click', btn._checkHandler);
    btn._checkHandler = function() {
      var inputId = this.getAttribute('data-inp');
      var fbId    = this.getAttribute('data-fb');
      var answers = this.getAttribute('data-ans').split('|');
      schkAny(inputId, fbId, answers);
    };
    btn.addEventListener('click', btn._checkHandler);
  });
}

function render() {
  const s = SLIDES[cur], total = SLIDES.length;
  const typeLabel = s.type === 'compete' ? 'Competition' : s.type.charAt(0).toUpperCase() + s.type.slice(1);
  document.getElementById('slide').innerHTML =
    '<div class="eyebrow">' +
    '<span class="stype t-' + s.type + '">' + typeLabel + '</span>' +
    '<span class="snum">Slide ' + (cur+1) + ' of ' + total + '</span>' +
    '</div>' +
    '<h1>' + s.title + '</h1>' +
    '<div class="sb">' + (s.body || '') + '</div>';
  document.getElementById('prog').style.width = ((cur+1)/total*100) + '%';
  document.getElementById('sctr').textContent  = (cur+1) + ' / ' + total;
  document.getElementById('prev-btn').disabled  = cur === 0;
  document.getElementById('next-btn').disabled  = cur === total - 1;
  const dots = document.getElementById('dots');
  dots.innerHTML = '';
  SLIDES.forEach((sl, i) => {
    const d = document.createElement('div');
    d.className = 'pdot' + (sl.type==='compete' ? ' compete-dot' : '') + (i===cur ? ' active' : i<cur ? ' done' : '');
    d.onclick = () => { cur=i; render(); };
    d.title = sl.title;
    dots.appendChild(d);
  });
  if (s.type === 'compete') {
    const lb = JSON.parse(localStorage.getItem('ks3_lb_' + LESSON_ID) || '[]');
    const el = document.getElementById('leaderboard');
    if (el) renderLeaderboard(el, lb);
  }
  attachCheckListeners();
}

function goNext() { if(cur<SLIDES.length-1){cur++;render();} }
function goPrev() { if(cur>0){cur--;render();} }
document.addEventListener('keydown', e => {
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();goNext();}
  if(e.key==='ArrowLeft'){e.preventDefault();goPrev();}
});

function schkAny(inputId, fbId, answers) {
  const clean = s => String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
  const val = clean(document.getElementById(inputId).value.trim());
  const ok  = answers.map(a => clean(a)).includes(val);
  const fb  = document.getElementById(fbId);
  fb.className   = 'fb ' + (ok ? 'ok' : 'no');
  fb.textContent = ok ? '✓ Correct!' : '✗ Try again — answer: ' + answers[0];
}

// ── SPEED CHALLENGE ──────────────────────────────────────────
let compQs = [], compIdx = 0, compScore = 0, compName = '', compTimer = null, compRunning = false;

function startComp() {
  compName = document.getElementById('comp-name').value.trim() || 'Anonymous';
  compScore = 0; compIdx = 0; compRunning = true;
  compQs = [...COMP_Qs].sort(() => Math.random()-0.5);
  document.getElementById('comp-start-area').style.display = 'none';
  document.getElementById('comp-game-area').style.display  = 'block';
  nextCompQ();
}

function nextCompQ() {
  if (compIdx >= compQs.length) { endComp(); return; }
  const q = compQs[compIdx];
  document.getElementById('comp-q').textContent       = q.q;
  document.getElementById('comp-qnum').textContent    = 'Q' + (compIdx+1) + ' / ' + compQs.length;
  document.getElementById('comp-ans').value           = '';
  document.getElementById('comp-feedback').textContent = '';
  document.getElementById('comp-ans').focus();
  let t = 15;
  const fill = document.getElementById('comp-timer-fill');
  fill.style.transition = 'none';
  fill.style.width = '100%';
  setTimeout(() => { fill.style.transition='width 1s linear'; fill.style.width='0%'; }, 50);
  clearInterval(compTimer);
  compTimer = setInterval(() => {
    t--;
    document.getElementById('comp-timeleft').textContent = t + 's';
    if (t <= 0) { clearInterval(compTimer); autoNextComp(); }
  }, 1000);
}

function autoNextComp() {
  if (!compRunning) return;
  const fb = document.getElementById('comp-feedback');
  fb.textContent = '⏱ Time! Ans: ' + compQs[compIdx].answers[0];
  fb.style.color = 'var(--danger)';
  compIdx++;
  setTimeout(nextCompQ, 1300);
}

function submitCompAns() {
  if (!compRunning) return;
  clearInterval(compTimer);
  const clean = s => String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
  const ans = clean(document.getElementById('comp-ans').value.trim());
  const q   = compQs[compIdx];
  const ok  = q.answers.map(a => clean(a)).includes(ans);
  const pct = parseFloat(document.getElementById('comp-timer-fill').style.width) || 0;
  const pts = ok ? Math.ceil(pct/10) + 10 : 0;
  const fb  = document.getElementById('comp-feedback');
  if (ok) {
    compScore += pts;
    document.getElementById('comp-score').textContent = compScore;
    fb.textContent = '✓ +' + pts + ' pts!';
    fb.style.color = 'var(--success)';
  } else {
    fb.textContent = '✗ Ans: ' + q.answers[0];
    fb.style.color = 'var(--danger)';
  }
  compIdx++;
  setTimeout(nextCompQ, 1000);
}

document.addEventListener('keydown', e => {
  const el = document.getElementById('comp-ans');
  if (e.key==='Enter' && compRunning && el && document.activeElement===el) submitCompAns();
});

function endComp() {
  compRunning = false;
  document.getElementById('comp-game-area').style.display = 'none';
  document.getElementById('comp-end-area').style.display  = 'block';
  document.getElementById('comp-final-name').textContent  = compName;
  document.getElementById('comp-final-score').textContent = compScore;
  const lb = JSON.parse(localStorage.getItem('ks3_lb_' + LESSON_ID) || '[]');
  lb.push({ name: compName, score: compScore, ts: Date.now() });
  lb.sort((a,b) => b.score - a.score);
  localStorage.setItem('ks3_lb_' + LESSON_ID, JSON.stringify(lb.slice(0,10)));
  const el = document.getElementById('comp-lb-end');
  if (el) renderLeaderboard(el, lb);
}

function resetComp() {
  document.getElementById('comp-end-area').style.display   = 'none';
  document.getElementById('comp-start-area').style.display = 'block';
  const lb = JSON.parse(localStorage.getItem('ks3_lb_' + LESSON_ID) || '[]');
  const el = document.getElementById('leaderboard');
  if (el) renderLeaderboard(el, lb);
}

function renderLeaderboard(el, lb) {
  el.innerHTML = lb.slice(0,10).map((e,i) =>
    '<li><span class="lb-pos">' + (i+1) + '</span>' +
    '<span class="lb-name">' + e.name + '</span>' +
    '<span class="lb-score">' + e.score + ' pts</span></li>'
  ).join('');
}

render();
</script>
